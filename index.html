<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>費用申請</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --muted: #6b7682; --line: #e4e7eb;
  --accent: #2f6f8f; --accent-soft: #e8f1f5; --ok: #2f7d55; --ok-soft: #e7f4ec;
  --notice: #9a6b00; --notice-soft: #fdf5e1; --warn: #c0392b; --warn-soft: #fdecea; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-decoration: none; }
h1 { font-size: 1.25rem; margin: 20px 0 12px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
.shell { max-width: 880px; margin: 0 auto; padding: 0 16px 110px; }
.topbar { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.topbar-inner { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 700; color: var(--text); white-space: nowrap; }
.topnav { display: flex; gap: 4px; flex: 1; }
.topnav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
.topnav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.tabbar { display: none; }
@media (max-width: 640px) {
  .topnav { display: none; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { flex: 1; text-align: center; padding: 12px 0 14px; color: var(--muted); font-size: .85rem; }
  .tabbar a.active { color: var(--accent); font-weight: 700; }
  .tabbar a.primary { color: #fff; background: var(--accent); font-weight: 700; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 16px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin: 0; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; gap: 12px; } }
.budget .label { color: var(--muted); font-size: .9rem; }
.budget .remaining { font-size: 2.6rem; font-weight: 700; line-height: 1.2; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.budget .remaining small { font-size: 1rem; font-weight: 600; margin-left: 2px; }
.budget.warning .remaining, .budget.exhausted .remaining, .budget.over .remaining { color: var(--warn); }
.budget.warning { border-color: #f1b9b2; background: var(--warn-soft); }
.budget.exhausted, .budget.over { border-color: #e88f84; background: var(--warn-soft); }
/* 残額カードの背景のイラスト（右側に薄く）。文字はその上に出す */
.budget { position: relative; overflow: hidden; }
.budget > :not(.bg-illust) { position: relative; }
.budget .bg-illust { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); height: 88%; max-width: 48%; object-fit: contain; opacity: .18; pointer-events: none; }
/* 「申請する」の見出しの横のイラスト */
.form-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.form-head h2 { margin: 0; }
.form-head img { height: 56px; max-width: 120px; object-fit: contain; }
/* 設定：イラストの指定欄 */
.illust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .illust-grid { grid-template-columns: 1fr; } }
.illust-slot { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.illust-slot .thumb { height: 96px; display: flex; align-items: center; justify-content: center; background: #fafbfc; border-radius: 8px; margin: 8px 0; color: var(--muted); font-size: .85rem; }
.illust-slot .thumb img { max-height: 96px; max-width: 100%; object-fit: contain; }
.bar { height: 12px; background: #edf0f3; border-radius: 99px; overflow: hidden; display: flex; }
.bar .used { background: var(--accent); }
.bar .pending { background: repeating-linear-gradient(45deg, #8fb3c6, #8fb3c6 6px, #b5ced9 6px, #b5ced9 12px); }
.budget.notice .bar .used { background: var(--notice); }
.budget.warning .bar .used, .budget.exhausted .bar .used, .budget.over .bar .used { background: var(--warn); }
.budget .rows { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: .9rem; color: var(--muted); flex-wrap: wrap; }
.budget .rows b { color: var(--text); font-variant-numeric: tabular-nums; }
.alert { border-radius: 10px; padding: 10px 14px; margin: 12px 0 0; font-weight: 600; }
.alert.notice { background: var(--notice-soft); color: var(--notice); }
.alert.warning, .alert.exhausted, .alert.over { background: var(--warn); color: #fff; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: none; }
.list a.row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; color: var(--text); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: .8rem; color: var(--muted); }
.row .amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .amount.void { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.empty { color: var(--muted); padding: 12px 0; }
.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.badge.pending { background: var(--notice-soft); color: var(--notice); }
.badge.approved { background: var(--ok-soft); color: var(--ok); }
.badge.rejected { background: var(--warn-soft); color: var(--warn); }
.badge.cancelled { background: #eef0f2; color: var(--muted); }
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .95rem; }
.req { color: var(--warn); font-size: .8rem; margin-left: 4px; }
.opt { color: var(--muted); font-size: .8rem; margin-left: 4px; font-weight: 400; }
.hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
.hint.bad { color: var(--warn); font-weight: 600; }
input[type=text], input[type=url], input[type=search], textarea, select { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #cfd5db; border-radius: 10px; background: #fff; color: var(--text); }
textarea { min-height: 88px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.amount-input { position: relative; }
.amount-input input { font-size: 1.6rem; font-weight: 700; padding-right: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.amount-input span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; margin: 8px 0; }
.btn { display: inline-block; font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 10px; border: 1px solid #cfd5db; background: #fff; color: var(--text); cursor: pointer; text-align: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--warn); border-color: #e9b4ae; }
.btn.block { display: block; width: 100%; padding: 14px; font-size: 1.05rem; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; min-width: 120px; }
.linkbtn { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: .85rem; padding: 4px; text-decoration: underline; }
.submit-bar { margin-top: 8px; }
@media (max-width: 640px) {
  .submit-bar.fixed { position: fixed; left: 0; right: 0; bottom: calc(50px + env(safe-area-inset-bottom)); z-index: 15; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 10px 16px; }
  .form-pad { height: 90px; }
}
.flash { border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.flash.error { background: var(--warn-soft); color: var(--warn); }
.flash.ok { background: var(--ok-soft); color: var(--ok); }
.dl { display: grid; grid-template-columns: 8em 1fr; gap: 8px 12px; margin: 0; }
.dl dt { color: var(--muted); font-size: .9rem; }
.dl dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
@media (max-width: 640px) { .dl { grid-template-columns: 1fr; gap: 0; } .dl dd { margin-bottom: 10px; } }
.big-amount { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.photo { max-width: 100%; max-height: 420px; border-radius: 10px; border: 1px solid var(--line); }
.preview { max-width: 160px; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
.timeline li { padding: 8px 0; border-top: 1px dashed var(--line); }
.timeline li:first-child { border-top: none; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.filters { display: grid; grid-template-columns: 1.2fr 1fr 2fr; gap: 8px; }
@media (max-width: 640px) { .filters { grid-template-columns: 1fr 1fr; } .filters .q { grid-column: 1 / -1; } }
.total { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); padding: 10px 0 0; border-top: 1px solid var(--line); margin-top: 6px; }
.total b { color: var(--text); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.center { text-align: center; padding: 60px 16px; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <a href="#/" class="brand">費用申請</a>
    <nav class="topnav" id="topnav"></nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
  </div>
</header>
<main class="shell" id="app"><p class="center">読み込んでいます…</p></main>
<nav class="tabbar" id="tabbar" hidden></nav>

<script>
'use strict';
// 窓口（Apps Script のウェブアプリの URL）。デプロイしたら書き換える。手元の見本（localhost）では見本の窓口を使う
const API_URL = 'https://script.google.com/macros/s/AKfycbw1XOHvc7v6hKX7om3_9qJHoe2ZmDvWJtY_NtygJS-DhP8uLp76uAcrfbpD4_uy2AIM/exec';
const LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const ENDPOINT = LOCAL ? '/api' : API_URL;
const MONTHLY_BUDGET = 25000;
const ANNUAL_BUDGET = 300000;
const MAX_IMAGE_CHARS = 1900000;
// 申請画面の「商品名・イベント名」の選択肢（「その他」は名称を入力）
const TITLE_CHOICES = ['ちいかわグッズ', 'ちいかわイベント', '外食', 'その他'];
const STATUS_LABEL = { pending: '申請中', approved: '承認済み', rejected: '却下', cancelled: 'キャンセル' };

// ---------- 合言葉 ----------
// 合言葉は URL の # のあと（サーバーやアクセス記録には残らない）。一度開いたら端末に覚えて、URL からは消す
let APP_KEY = '';
function readKey() {
  const m = location.hash.match(/key=([\w-]+)/);
  try {
    if (m) localStorage.setItem('expense-key', m[1]);
    APP_KEY = m ? m[1] : (localStorage.getItem('expense-key') || '');
  } catch (e) {
    APP_KEY = m ? m[1] : APP_KEY;
  }
  if (m) history.replaceState(null, '', location.pathname + '#/');
}
readKey();

async function api(action, ...args) {
  // text/plain にすると事前の確認（CORS のプリフライト）が起きず、Apps Script でも受け取れる
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: APP_KEY, action, args }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

// ---------- 表示の小物 ----------
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => Number(n).toLocaleString('ja-JP') + '円';
const JST = 9 * 3600 * 1000;
function fmt(ms, withTime) {
  const d = new Date(ms + JST);
  const p = (n) => String(n).padStart(2, '0');
  const s = `${d.getUTCFullYear()}/${p(d.getUTCMonth() + 1)}/${p(d.getUTCDate())}`;
  return withTime ? `${s} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}` : s;
}
const monthLabel = (k) => `${Number(k.slice(0, 4))}年${Number(k.slice(5, 7))}月`;
const fyOf = (k, start) => (Number(k.slice(5, 7)) >= start ? Number(k.slice(0, 4)) : Number(k.slice(0, 4)) - 1);
function fyMonths(fy, start) {
  const out = [];
  for (let i = 0; i < 12; i++) {
    const m0 = start - 1 + i;
    out.push(`${fy + Math.floor(m0 / 12)}-${String((m0 % 12) + 1).padStart(2, '0')}`);
  }
  return out;
}
const fyShort = (fy, start) => `${fy}年度（${start}月〜${((start + 10) % 12) + 1}月）`;
function fyLabel(fy, start) {
  const ms = fyMonths(fy, start);
  return `${fy}年度（${monthLabel(ms[0])}〜${monthLabel(ms[11])}）`;
}
function parseAmount(s) {
  const t = String(s).replace(/[,，\s円]/g, '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  return /^\d+$/.test(t) ? Number(t) : null;
}
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9]/g, '').slice(0, 32).padEnd(16, '0');

// 残額の注意表示：月間は 20,000円・23,000円・25,000円、年間は同じ割合（80%・92%・100%）
function alertFor(kind, used) {
  const budget = kind === 'monthly' ? MONTHLY_BUDGET : ANNUAL_BUDGET;
  const t = kind === 'monthly' ? { notice: 20000, warning: 23000 } : { notice: 240000, warning: 276000 };
  const label = kind === 'monthly' ? '今月' : '今年度';
  const remaining = Math.max(0, budget - used);
  if (used > budget) return { level: 'over', message: `${label}の予算を${yen(used - budget)}超えています` };
  if (used >= budget) return { level: 'exhausted', message: `${label}の予算を使い切りました` };
  if (used >= t.warning) return { level: 'warning', message: `${label}はあと${yen(remaining)}です` };
  if (used >= t.notice) return { level: 'notice', message: `${label}はあと${yen(remaining)}です` };
  return { level: 'none', message: '' };
}

/** 使い切り・超過のとき（イラストを「使い切り」の表情にする） */
const used_up = (a) => a.level === 'exhausted' || a.level === 'over';

// ---------- イラスト ----------
// 管理者が「設定」で上げた画像。版（illustVersion）が変わったときだけ読み直し、端末に覚えておく
const ILLUST_SLOTS = [
  ['form_normal', '「申請する」の横', 'ふだん'], ['form_over', '「申請する」の横', '使い切り・超過'],
  ['card_normal', '残額カードの背景（薄く表示）', 'ふだん'], ['card_over', '残額カードの背景（薄く表示）', '使い切り・超過'],
];
let illusts = {};
async function loadIllusts(version) {
  if (!version) { illusts = {}; return; }
  try {
    const c = JSON.parse(localStorage.getItem('expense-illust') || 'null');
    if (c && c.version === version) { illusts = c.images; return; }
  } catch (e) { /* 覚えていなければ読み直す */ }
  try {
    const r = await api('getIllustrations');
    illusts = r.images;
    try { localStorage.setItem('expense-illust', JSON.stringify(r)); } catch (e) { /* 入りきらなければ毎回読む */ }
  } catch (e) {
    illusts = {}; // イラストが読めなくてもアプリは使える
  }
}

function budgetCard(kind, part, caption) {
  const a = alertFor(kind, part.used);
  const pct = (n) => Math.min(100, Math.max(0, (n / part.budget) * 100)) + '%';
  const name = kind === 'monthly' ? '今月' : '年間';
  const bg = illusts[used_up(a) ? 'card_over' : 'card_normal'];
  return `<section class="card budget ${a.level}" aria-label="${name}の残額">
    ${bg ? `<img class="bg-illust" src="${bg}" alt="" aria-hidden="true">` : ''}
    <div class="label">${name}の残額<span class="small">　${esc(caption)}</span></div>
    <div class="remaining">${Math.max(0, part.remaining).toLocaleString('ja-JP')}<small>円</small></div>
    <div class="bar" role="img" aria-label="予算 ${yen(part.budget)}のうち ${yen(part.used)}を使用">
      <div class="used" style="width:${pct(part.approved)}"></div><div class="pending" style="width:${pct(part.pending)}"></div>
    </div>
    <div class="rows"><span>${name}の使用額 <b>${yen(part.used)}</b></span><span>予算 <b>${yen(part.budget)}</b></span></div>
    ${part.pending > 0 ? `<div class="small muted">うち申請中 ${yen(part.pending)}（承認前ですが予算から差し引いています）</div>` : ''}
    ${a.level !== 'none' ? `<div class="alert ${a.level}" role="status">${esc(a.message)}</div>` : ''}
  </section>`;
}

const badge = (s) => `<span class="badge ${s}">${STATUS_LABEL[s]}</span>`;
function list(items, empty) {
  if (!items.length) return `<p class="empty">${esc(empty || '申請はまだありません')}</p>`;
  return `<ul class="list">${items.map((r) => {
    const counted = r.status === 'pending' || r.status === 'approved';
    return `<li><a class="row" href="#/r/${esc(r.id)}"><div class="main"><div class="title">${esc(r.title)}</div>
      <div class="sub">${fmt(r.createdAt)}・${esc(r.applicant)}</div></div>${badge(r.status)}
      <div class="amount ${counted ? '' : 'void'}">${yen(r.amount)}</div></a></li>`;
  }).join('')}</ul>`;
}

// ---------- ナビ ----------
let me = null;
function renderNav(path) {
  if (!me) return;
  // 申請はホームのフォームから行うので、メニューは「ホーム」「履歴」（管理者は「設定」も）
  const items = [['#/', 'ホーム'], ['#/requests', '履歴']];
  if (me.role === 'admin') items.push(['#/settings', '設定']);
  const active = (h) => (h === '#/' ? path === '/' : path.startsWith(h.slice(1)) || (h === '#/requests' && path.startsWith('/r/')));
  document.getElementById('topnav').innerHTML = items.map(([h, l]) => `<a href="${h}" class="${active(h) ? 'active' : ''}">${l}</a>`).join('');
  document.getElementById('tabbar').innerHTML = items.map(([h, l, p]) => `<a href="${h}" class="${active(h) ? 'active' : ''} ${p ? 'primary' : ''}">${l}</a>`).join('');
  document.getElementById('who').textContent = `${me.name}（${me.role === 'admin' ? '管理者' : '申請者'}）`;
  document.getElementById('topbar').hidden = false;
  document.getElementById('tabbar').hidden = false;
}

// ---------- 画面 ----------
let flash = '';

async function pageHome() {
  const d = await api('getDashboard');
  await loadIllusts(d.illustVersion);
  me = d.me;
  const s = d.summary;
  let html = `<h1>${monthLabel(s.month)}</h1>${flashHtml()}<div class="grid2">
    ${budgetCard('monthly', s.monthly, `毎月 ${yen(s.monthly.budget)}`)}
    ${budgetCard('annual', s.annual, fyShort(s.fiscalYear, s.fiscalStartMonth))}</div>
    ${requestForm(d, false)}`;
  // 承認待ちは、管理者が承認する設定のとき（または残っているとき）だけ
  if (me.role === 'admin' && (!d.autoApprove || d.pending.length)) html += `<section class="card"><h2>承認待ち（${d.pending.length}件）</h2>${list(d.pending, '承認待ちの申請はありません')}</section>`;
  else if (me.role !== 'admin' && d.pending.length) html += `<section class="card"><h2>申請中（${d.pending.length}件）</h2>${list(d.pending)}</section>`;
  html += `<section class="card"><div class="section-head"><h2>最近の申請</h2><a href="#/requests" class="small">すべて見る</a></div>${list(d.recent)}</section>`;
  return html;
}

async function pageNew() {
  const d = await api('getDashboard');
  await loadIllusts(d.illustVersion);
  me = d.me;
  return `<h1>申請する</h1>${requestForm(d, true)}`;
}

/** 申請フォーム（ホームと「申請する」画面で共通）。fixedBar：スマホで送信ボタンを画面の下に固定する */
function requestForm(d, fixedBar) {
  const s = d.summary;
  const available = Math.max(0, Math.min(s.monthly.remaining, s.annual.remaining));
  const id = newId(); // この画面で1回だけ作る。二重に送っても同じIDなので1件になる
  setTimeout(() => bindNewForm(id, available, s), 0);
  const side = illusts[available <= 0 ? 'form_over' : 'form_normal'];
  return `<form class="card" id="f" novalidate>${fixedBar ? '' : `<div class="form-head"><h2>申請する</h2>${side ? `<img src="${side}" alt="" aria-hidden="true">` : ''}</div>`}
    <div class="field"><label for="category">商品名・イベント名<span class="req">必須</span></label>
      <select id="category"><option value="">選んでください</option>${TITLE_CHOICES.map((c) => `<option>${esc(c)}</option>`).join('')}</select>
      <input id="title" type="text" maxlength="100" autocomplete="off" placeholder="名称を入力" style="margin-top:8px" hidden></div>
    <div class="field"><label for="amount">金額（税込）<span class="req">必須</span></label>
      <div class="amount-input"><input id="amount" type="text" inputmode="numeric" placeholder="0" autocomplete="off"><span>円</span></div>
      <div class="hint" id="amountHint"></div></div>
    <div class="field"><label for="url">商品・イベントの URL<span class="opt">任意</span></label><input id="url" type="url" inputmode="url" placeholder="https://" maxlength="500" autocomplete="off"></div>
    <div class="field"><label for="memo">内容・用途のメモ<span class="opt">任意</span></label><textarea id="memo" maxlength="1000"></textarea></div>
    <div class="field"><label for="image">画像<span class="opt">任意</span></label><input id="image" type="file" accept="image/*">
      <div id="imageBox"></div></div>
    <div id="err"></div>
    ${available <= 0 ? '<div class="flash error">残額がないため、申請できません</div>' : ''}
    ${fixedBar ? '<div class="form-pad"></div>' : ''}
    <div class="submit-bar ${fixedBar ? 'fixed' : ''}"><button type="submit" class="btn primary block" id="submit" disabled>申請する</button></div>
  </form>`;
}

function bindNewForm(id, available, s) {
  const f = document.getElementById('f');
  if (!f) return;
  const el = (x) => document.getElementById(x);
  let image = '', imageBusy = false, busy = false;
  // 「その他」のときだけ名称を入力する
  const title = () => (el('category').value === 'その他' ? el('title').value.trim() : el('category').value);
  el('category').addEventListener('change', () => {
    el('title').hidden = el('category').value !== 'その他';
    if (!el('title').hidden) el('title').focus();
  });
  function update() {
    const amount = parseAmount(el('amount').value);
    const over = amount != null && amount > available;
    const hint = el('amountHint');
    if (over) { hint.className = 'hint bad'; hint.textContent = `残額が足りません（申請できるのは ${yen(available)}まで）`; }
    else if (el('amount').value && amount == null) { hint.className = 'hint bad'; hint.textContent = '金額は数字で入力してください'; }
    else { hint.className = 'hint'; hint.textContent = `今月の残額 ${yen(Math.max(0, s.monthly.remaining))}・年間の残額 ${yen(Math.max(0, s.annual.remaining))}`; }
    const can = !busy && !imageBusy && title() !== '' && amount != null && amount > 0 && !over;
    el('submit').disabled = !can;
    el('submit').textContent = busy ? '送信しています…' : amount ? `${yen(amount)}で申請する` : '申請する';
    return can ? amount : null;
  }
  f.addEventListener('input', update);
  update();
  el('image').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    imageBusy = true; update();
    el('imageBox').innerHTML = '<div class="hint">画像を準備しています…</div>';
    try {
      image = await shrinkImage(file);
      el('imageBox').innerHTML = `<img src="${image}" alt="添付する画像" class="preview"><button type="button" class="linkbtn" id="rmImg">画像を外す</button>`;
      el('rmImg').onclick = () => { image = ''; el('image').value = ''; el('imageBox').innerHTML = ''; };
    } catch (err) {
      image = ''; e.target.value = '';
      el('imageBox').innerHTML = '<div class="hint bad">この画像は添付できませんでした。別の画像を選んでください</div>';
    }
    imageBusy = false; update();
  });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = update();
    if (amount == null || busy) return;
    busy = true; update(); el('err').innerHTML = '';
    try {
      const r = await api('createRequest', { id, title: title(), amount, url: el('url').value, memo: el('memo').value, image });
      flash = r.status === 'approved' ? `「${title()}」${yen(amount)}を申請し、承認されました。` : `「${title()}」${yen(amount)}を申請しました。管理者の確認をお待ちください。`;
      // ホームから申請したときはホームのまま（残額がすぐ変わる）、「申請する」画面からはホームへ
      if (location.hash === '#/' || location.hash === '') route();
      else location.hash = '#/';
    } catch (err) {
      el('err').innerHTML = `<div class="flash error" role="alert">${esc(err.message)}</div>`;
      busy = false; update();
    }
  });
}

async function shrinkImage(file) {
  const bitmap = await createImageBitmap(file);
  try {
    for (const [max, q] of [[1600, 0.82], [1200, 0.72], [900, 0.6], [700, 0.5]]) {
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bitmap.width * scale);
      c.height = Math.round(bitmap.height * scale);
      c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q);
      if (url.length <= MAX_IMAGE_CHARS) return url;
    }
  } finally {
    if (bitmap.close) bitmap.close();
  }
  throw new Error('too large');
}

async function pageRequests(params) {
  const d = await api('listRequests');
  me = d.me;
  const start = d.fiscalStartMonth;
  const months = [...new Set([d.currentMonth, ...d.requests.map((r) => r.month)])].sort().reverse();
  const years = [...new Set(months.map((m) => fyOf(m, start)))].sort((a, b) => b - a);
  const state = {
    period: params.get('period') || `fy:${fyOf(d.currentMonth, start)}`,
    status: params.get('status') || '',
    q: params.get('q') || '',
  };
  setTimeout(() => {
    const f = document.getElementById('filters');
    if (!f) return;
    const apply = () => {
      const p = new URLSearchParams({ period: f.period.value, status: f.status.value, q: f.q.value });
      renderList(d, start, { period: f.period.value, status: f.status.value, q: f.q.value });
      history.replaceState(null, '', '#/requests?' + p.toString());
    };
    f.addEventListener('change', apply);
    f.q.addEventListener('input', apply);
    f.addEventListener('submit', (e) => { e.preventDefault(); apply(); });
    renderList(d, start, state);
  }, 0);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  return `<h1>申請履歴</h1><form class="card filters" id="filters">
    <select name="period" aria-label="期間">${opt('all', 'すべての期間', state.period)}
      <optgroup label="年度">${years.map((y) => opt(`fy:${y}`, fyLabel(y, start), state.period)).join('')}</optgroup>
      <optgroup label="月">${months.map((m) => opt(`m:${m}`, monthLabel(m), state.period)).join('')}</optgroup></select>
    <select name="status" aria-label="状態">${opt('', 'すべての状態', state.status)}${Object.keys(STATUS_LABEL).map((s) => opt(s, STATUS_LABEL[s], state.status)).join('')}</select>
    <input class="q" type="search" name="q" value="${esc(state.q)}" placeholder="名称・メモで検索">
  </form><section class="card" id="listBox"></section>`;
}

function renderList(d, start, st) {
  let inPeriod = () => true;
  if (st.period.startsWith('m:')) inPeriod = (m) => m === st.period.slice(2);
  else if (st.period.startsWith('fy:')) { const set = new Set(fyMonths(Number(st.period.slice(3)), start)); inPeriod = (m) => set.has(m); }
  const q = st.q.trim().toLowerCase();
  const items = d.requests.filter((r) => inPeriod(r.month) && (!st.status || r.status === st.status) && (!q || `${r.title}\n${r.memo}\n${r.url}`.toLowerCase().includes(q)));
  const counted = items.filter((r) => r.status === 'approved' || r.status === 'pending').reduce((s, r) => s + r.amount, 0);
  document.getElementById('listBox').innerHTML = list(items, '該当する申請はありません') +
    `<div class="total"><span>${items.length}件</span><span>使用額（承認済み＋申請中）<b>${yen(counted)}</b></span></div>`;
}

async function pageRequest(id) {
  const d = await api('getRequest', id);
  me = d.me;
  const r = d.request;
  const isAdmin = me.role === 'admin';
  if (r.hasImage) {
    api('getImage', id).then((src) => {
      const box = document.getElementById('imgBox');
      if (box) box.innerHTML = `<img src="${src}" alt="添付画像" class="photo">`;
    }).catch(() => {});
  }
  setTimeout(() => bindActions(r), 0);
  const histHtml = d.history.map((h) => {
    let t = h.action;
    if (h.fromAmount != null && h.fromAmount !== h.toAmount) t += ` ${yen(h.fromAmount)} → ${yen(h.toAmount)}`;
    else if (h.action === '申請') t += ` ${yen(h.toAmount)}`;
    if (h.fromStatus && h.fromStatus !== h.toStatus) t += `（${h.fromStatus} → ${h.toStatus}）`;
    return `<li><div>${esc(t)}</div><div class="small muted">${fmt(h.at, true)}・${esc(h.by)}${h.note ? `「${esc(h.note)}」` : ''}</div></li>`;
  }).join('');

  let actions = '';
  if (isAdmin && (r.status === 'pending' || r.status === 'approved')) {
    actions = `<section class="card"><h2>管理者の操作</h2>
      <div class="field"><label for="newAmount">金額（税込）${r.status === 'pending' ? '：変えて承認することもできます' : 'の訂正'}</label>
        <div class="amount-input"><input id="newAmount" type="text" inputmode="numeric" value="${r.amount}"><span>円</span></div></div>
      <div class="field"><label for="note">コメント<span class="opt">任意・変更履歴に残ります</span></label><input id="note" type="text" maxlength="500"></div>
      <label class="check"><input type="checkbox" id="allowOver"><span>予算を超える場合も確定する（通常はチェックしません）</span></label>
      <div id="actErr"></div><div class="btns" id="actBtns"></div></section>`;
  } else if (d.canCancel) {
    actions = `<section class="card"><button class="btn danger block" id="selfCancel">申請をキャンセルする</button><div id="actErr"></div></section>`;
  }
  return `<p class="small"><a href="#/requests">← 履歴へ</a></p>${flashHtml()}
    <section class="card"><div class="section-head"><h1 style="margin:0">${esc(r.title)}</h1>${badge(r.status)}</div>
      <div class="big-amount" style="margin:8px 0 16px">${yen(r.amount)}<span class="small muted">（税込）</span></div>
      <dl class="dl"><dt>申請日時</dt><dd>${fmt(r.createdAt, true)}</dd><dt>計上する月</dt><dd>${monthLabel(r.month)}</dd>
        <dt>申請者</dt><dd>${esc(r.applicant)}</dd>
        <dt>URL</dt><dd>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(r.url)}</a>` : '<span class="muted">なし</span>'}</dd>
        <dt>メモ</dt><dd>${r.memo ? esc(r.memo) : '<span class="muted">なし</span>'}</dd></dl>
      ${r.hasImage ? '<div id="imgBox" style="margin-top:12px" class="small muted">画像を読み込んでいます…</div>' : ''}
    </section>${actions}
    <section class="card"><h2>変更履歴</h2><ul class="timeline">${histHtml}</ul></section>`;
}

function bindActions(r) {
  const el = (x) => document.getElementById(x);
  async function act(action, input, confirmText) {
    if (!confirm(confirmText)) return;
    document.querySelectorAll('#actBtns button, #selfCancel').forEach((b) => (b.disabled = true));
    try {
      await api(action, r.id, input);
      flash = '更新しました';
      route();
    } catch (err) {
      el('actErr').innerHTML = `<div class="flash error" role="alert">${esc(err.message)}</div>`;
      document.querySelectorAll('#actBtns button, #selfCancel').forEach((b) => (b.disabled = false));
    }
  }
  if (el('selfCancel')) el('selfCancel').onclick = () => act('cancel', {}, 'この申請をキャンセルしますか？（残額に戻ります）');
  const box = el('actBtns');
  if (!box) return;
  function draw() {
    const parsed = parseAmount(el('newAmount').value);
    const changed = parsed != null && parsed > 0 && parsed !== r.amount;
    const input = () => ({ note: el('note').value, allowOverBudget: el('allowOver').checked });
    const btns = [];
    if (r.status === 'pending') {
      btns.push(['ok', changed ? `${yen(parsed)}で承認` : '承認', () => act('approve', { ...input(), amount: changed ? parsed : null }, changed ? `${yen(parsed)}に変更して承認しますか？` : '承認しますか？')]);
      btns.push(['danger', '却下', () => act('reject', input(), '却下しますか？（残額に戻ります）')]);
      if (changed) btns.push(['', '金額だけ訂正', () => act('amend', { ...input(), amount: parsed }, '金額だけ訂正しますか？（申請中のまま）')]);
    } else {
      btns.push(['', '金額を訂正', () => act('amend', { ...input(), amount: parsed }, `${yen(parsed)}に訂正しますか？`), !changed]);
    }
    btns.push(['danger', 'キャンセル', () => act('cancel', input(), 'この申請をキャンセルしますか？（残額に戻ります）')]);
    box.innerHTML = '';
    btns.forEach(([cls, label, fn, disabled]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + cls; b.textContent = label; b.disabled = !!disabled; b.onclick = fn;
      box.appendChild(b);
    });
  }
  el('newAmount').addEventListener('input', draw);
  draw();
}

async function pageSettings() {
  const d = await api('getDashboard');
  await loadIllusts(d.illustVersion);
  me = d.me;
  if (me.role !== 'admin') { location.hash = '#/'; return ''; }
  const s = d.summary;
  setTimeout(() => {
    const sel = document.getElementById('fsm');
    const btn = document.getElementById('saveFsm');
    if (!sel) return;
    sel.onchange = () => (btn.disabled = Number(sel.value) === s.fiscalStartMonth);
    btn.onclick = async () => {
      if (!confirm(`年度の開始月を${sel.value}月にしますか？`)) return;
      btn.disabled = true;
      try { await api('setFiscalStartMonth', Number(sel.value)); flash = '保存しました'; route(); }
      catch (err) { document.getElementById('setErr').innerHTML = `<div class="flash error">${esc(err.message)}</div>`; btn.disabled = false; }
    };
    bindIllustSettings();
    const auto = document.getElementById('autoApprove');
    auto.onchange = async () => {
      const on = auto.checked;
      if (!confirm(on ? '申請を自動で承認するようにしますか？' : '管理者が承認するようにしますか？（申請は「申請中」になります）')) { auto.checked = !on; return; }
      auto.disabled = true;
      try { await api('setAutoApprove', on); flash = '保存しました'; route(); }
      catch (err) { document.getElementById('autoErr').innerHTML = `<div class="flash error">${esc(err.message)}</div>`; auto.checked = !on; auto.disabled = false; }
    };
  }, 0);
  return `<h1>設定</h1>${flashHtml()}<section class="card"><h2>イラスト</h2>
    <p class="small muted">「使い切り・超過」は、今月（年間のカードは年間）の予算を使い切ったときに切り替わります。透明の背景の PNG がおすすめです。</p>
    <div class="illust-grid">${ILLUST_SLOTS.map(([slot, place, mood]) => `<div class="illust-slot">
      <div><b>${esc(place)}</b><span class="small muted">　${esc(mood)}</span></div>
      <div class="thumb" id="thumb-${slot}">${illusts[slot] ? `<img src="${illusts[slot]}" alt="">` : 'まだありません'}</div>
      <div class="btns"><label class="btn">選ぶ<input type="file" accept="image/*" data-slot="${slot}" hidden></label>
      ${illusts[slot] ? `<button type="button" class="btn danger" data-remove="${slot}">外す</button>` : ''}</div></div>`).join('')}</div>
    <div id="illustErr"></div></section>
    <section class="card"><h2>承認のしかた</h2>
    <label class="check" style="font-size:1rem"><input type="checkbox" id="autoApprove" ${d.autoApprove ? 'checked' : ''}><span>申請を自動で承認する</span></label>
    <p class="small muted">オンのときは、残額の範囲内の申請がそのまま承認済みになります。あとから管理者が金額の訂正・キャンセルをできます。申請者も、自動で承認された自分の申請は取り消せます。</p>
    <div id="autoErr"></div></section>
    <section class="card"><h2>年度の開始月</h2>
    <p class="small muted">今年度：${fyLabel(s.fiscalYear, s.fiscalStartMonth)}</p>
    <div class="btns" style="align-items:center"><select id="fsm" aria-label="年度の開始月" style="flex:1">
      ${Array.from({ length: 12 }, (_, i) => i + 1).map((m) => `<option value="${m}" ${m === s.fiscalStartMonth ? 'selected' : ''}>${m}月</option>`).join('')}
    </select><button class="btn primary" id="saveFsm" disabled>保存</button></div><div id="setErr"></div>
    <p class="small muted">変更すると、年間の使用額は新しい年度の区切りで数え直されます（申請の記録は変わりません）。</p></section>
    <section class="card"><h2>予算</h2><dl class="dl">
      <dt>月間予算</dt><dd>${yen(MONTHLY_BUDGET)}（毎月1日 0時にリセット・繰り越しなし）</dd>
      <dt>年間予算</dt><dd>${yen(ANNUAL_BUDGET)}（年度の初めにリセット）</dd></dl></section>`;
}

function bindIllustSettings() {
  const err = (m) => (document.getElementById('illustErr').innerHTML = m ? `<div class="flash error">${esc(m)}</div>` : '');
  async function save(slot, dataUrl) {
    err('');
    try { await api('setIllustration', slot, dataUrl); flash = '保存しました'; route(); }
    catch (e) { err(e.message); }
  }
  document.querySelectorAll('input[data-slot]').forEach((input) => {
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      document.getElementById('thumb-' + input.dataset.slot).textContent = '準備しています…';
      try { await save(input.dataset.slot, await prepareIllust(file)); }
      catch (e) { err('この画像は使えませんでした。別の画像を選んでください'); route(); }
    };
  });
  document.querySelectorAll('button[data-remove]').forEach((b) => {
    b.onclick = () => { if (confirm('このイラストを外しますか？')) save(b.dataset.remove, ''); };
  });
}

/** イラストの画像。小さければそのまま（GIF の動きや透明もそのまま）、大きければ透明を残して縮める */
async function prepareIllust(file) {
  const asIs = await new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result));
    r.onerror = ng;
    r.readAsDataURL(file);
  });
  if (/^data:image\/(png|jpeg|webp|gif);base64,/.test(asIs) && asIs.length <= 700000) return asIs;
  const bitmap = await createImageBitmap(file);
  try {
    for (const max of [800, 600, 400]) {
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bitmap.width * scale);
      c.height = Math.round(bitmap.height * scale);
      c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/webp', 0.9);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/png');
      if (url.length <= 700000) return url;
    }
  } finally {
    if (bitmap.close) bitmap.close();
  }
  throw new Error('too large');
}

function flashHtml() {
  if (!flash) return '';
  const h = `<div class="flash ok">${esc(flash)}</div>`;
  flash = '';
  return h;
}

// ---------- 画面の切り替え ----------
let routeSeq = 0;
async function route() {
  const seq = ++routeSeq;
  if (/key=/.test(location.hash)) readKey(); // 開いたまま別の合言葉の URL を開いたとき
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  renderNav(path);
  if (!APP_KEY) {
    $app.innerHTML = '<p class="center">この端末ではまだ使えません。<br>教わった URL（#key= の付いたもの）を一度開いてください。</p>';
    return;
  }
  try {
    let html;
    if (path === '/new') html = await pageNew();
    else if (path === '/requests') html = await pageRequests(new URLSearchParams(qs || ''));
    else if (path.startsWith('/r/')) html = await pageRequest(decodeURIComponent(path.slice(3)));
    else if (path === '/settings') html = await pageSettings();
    else html = await pageHome();
    if (seq !== routeSeq) return; // 途中で別の画面に移った
    $app.innerHTML = html;
    renderNav(path);
    window.scrollTo(0, 0);
  } catch (err) {
    if (seq !== routeSeq) return;
    $app.innerHTML = `<div class="flash error" role="alert">${esc(err.message || '読み込めませんでした')}</div>
      <p><button class="btn" onclick="route()">もう一度読み込む</button></p>`;
  }
}
window.addEventListener('hashchange', route);
route();
